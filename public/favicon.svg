<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24.5 -8 296 296">
  <!--
    Tab favicon. The art is 247x280, centred here in a square box with ~5%
    padding so it is not cropped by the browser's rounded mask.

    The lower shape follows the codebase convention: navy on light surfaces
    (the designer's original), sky on dark ones (what Navbar.tsx uses, because
    navy disappears against the black bar). A tab strip is either, depending on
    the OS theme, so the choice is made at render time rather than guessed.
  -->
  <style>
    .accent { fill: #033B66; }
    @media (prefers-color-scheme: dark) { .accent { fill: #38BDF8; } }
  </style>
  <defs>
    <linearGradient id="swoosh" x1="184" y1="36.5" x2="18" y2="180.5" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F47B09" />
      <stop offset="1" stop-color="#FBAC09" />
    </linearGradient>
  </defs>
